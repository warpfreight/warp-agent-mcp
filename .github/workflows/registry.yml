name: Publish to MCP Registry (OIDC)

# Publishes server.json to registry.modelcontextprotocol.io via GitHub OIDC.
# github-oidc authenticates the io.github.warpfreight namespace from the repo's
# org ownership — no personal org membership needs to be public, no device flow.
# Run from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
    inputs:
      deprecate_0_5_75:
        description: "Also deprecate the ancient 0.5.75 registry row"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mp.tgz
          tar -xzf mp.tgz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help >/dev/null && echo "mcp-publisher installed"

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish server.json to the registry
        run: mcp-publisher publish

      - name: Deprecate the ancient 0.5.75 row
        if: ${{ inputs.deprecate_0_5_75 }}
        run: |
          mcp-publisher status --status deprecated \
            --message "Superseded. Use the latest version." \
            io.github.warpfreight/warp-agent-mcp 0.5.75 \
            || echo "deprecate step non-fatal (already deprecated or nothing to change)"
